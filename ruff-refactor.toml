target-version = 'py312'
line-length = 88

[format]
quote-style = 'single'
skip-magic-trailing-comma = true
docstring-code-format = true

[lint]
select = [
    'ANN',
    'B',
    'BLE001',
    'C4',
    'C901',
    'D',
    'E4',
    'E7',
    'E9',
    'F',
    'I',
    'N',
    'PGH004',
    'PIE',
    'PLR0912',
    'PLR0915',
    'PLR5501',
    'PT',
    'RET505',
    'RET506',
    'RET507',
    'RET508',
    'RUF100',
    'SIM',
    'TID251',
    'UP',
    'W505',
]
ignore = ['ANN401', 'D104', 'D105', 'D107', 'SIM105', 'SIM108', 'SIM116']

[lint.per-file-ignores]
'tests/**' = ['D']

[lint.isort]
split-on-trailing-comma = false

[lint.pycodestyle]
max-doc-length = 88

[lint.pydocstyle]
convention = 'google'

[lint.flake8-copyright]
author = 'TorchGeo Contributors'
notice-rgx = 'Copyright \(c\)'

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-branches = 12
max-statements = 50

[lint.flake8-tidy-imports.banned-api]
'__future__.annotations'.msg = 'Use ordinary annotations or quoted forward references.'
