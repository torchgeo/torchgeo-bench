[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.6,<0.12" ]

[project]
name = "torchgeo-bench"
version = "0.5.0"
description = "Lightweight benchmarking framework for geospatial models"
readme = "README.md"
keywords = [
  "benchmark",
  "earth observation",
  "foundation models",
  "geospatial",
  "machine learning",
  "remote sensing",
]
license = { text = "MIT" }
authors = [
  { name = "Caleb Robinson", email = "calebrob6@gmail.com" },
  { name = "Isaac Corley", email = "isaac.a.corley@gmail.com" },
  { name = "Nils Lehmann", email = "nils.lehmann24@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "faissknn[cpu]>=0.4; sys_platform!='linux' or platform_machine!='x86_64'",
  "faissknn[cuda]>=0.4; sys_platform=='linux' and platform_machine=='x86_64'",
  "filelock>=3.12",
  "geobenchv2>=0.9",
  "h5py>=3.8",
  "huggingface-hub>=0.20",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "pandas>=2",
  "pydantic>=2",
  "pyarrow>=14",                                                               # read CoordBench parquet tables via pandas
  "pyyaml>=6",
  "rich>=13",
  "safetensors>=0.4",                                                          # load MIND location-encoder weights
  "scikit-learn>=1.3",
  "timm>=0.9",
  "torch>=2",
  "torchgeo>=0.10",
  "torchmetrics>=1.4",
  "torchvision>=0.15",
]
optional-dependencies.all = [
  "torchgeo-bench[cleanlab]",
  "torchgeo-bench[coordbench]",
  "torchgeo-bench[dev]",
  "torchgeo-bench[docs]",
  "torchgeo-bench[id]",
  "torchgeo-bench[olmoearth]",
  "torchgeo-bench[sam3]",
  "torchgeo-bench[terratorch]",
  "torchgeo-bench[viz]",
]
optional-dependencies.cleanlab = [
  "cleanlab>=2.7",
  "imagehash>=4.3",
  "matplotlib>=3.5",
  "pillow>=9",
]
optional-dependencies.coordbench = [
  "rshf>=0.2", # pretrained location encoders: SatCLIP/GeoCLIP/Climplicit/SINR
]
optional-dependencies.dev = [
  "mdformat>=0.7.22",
  "pre-commit>=4.3",
  "pyproject-fmt>=2.21",
  "pytest>=7.3",
  "pytest-cov>=4.1",
  "pytest-xdist>=3.6",
  "ruff==0.15.10",
  "ty>=0.0.21",
  "types-pyyaml>=6",
]
optional-dependencies.docs = [
  "linkify-it-py>=2",
  "myst-parser>=2",
  "pydata-sphinx-theme>=0.15",
  "sphinx>=7",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.5",
]
optional-dependencies.id = [
  "torchid>=0.3; python_version>='3.13'",
]
optional-dependencies.olmoearth = [
  "olmoearth-pretrain-minimal>=0.0.6", # 0.0.6 adds OlmoEarth v1.2 (ModelID.OLMOEARTH_V1_2_*)
]
optional-dependencies.sam3 = [
  "transformers>=4.50",
]
optional-dependencies.terratorch = [
  "terratorch>=1",
]
optional-dependencies.viz = [
  "matplotlib>=3.5",
  "pillow>=9",
]
urls.Documentation = "https://torchgeo.org/torchgeo-bench/"
urls.Homepage = "https://github.com/torchgeo/torchgeo-bench"
urls.Issues = "https://github.com/torchgeo/torchgeo-bench/issues"
urls.Repository = "https://github.com/torchgeo/torchgeo-bench"
scripts.torchgeo-bench = "torchgeo_bench.cli:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/torchgeo_bench" ]

[tool.uv]
build-backend.source-exclude = [ "/docs/_build" ]
build-backend.source-include = [ "docs/**", "examples/**" ]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "outputs",
]
extend-exclude = [
  "scripts/check_refactor_style.py",
  "src/torchgeo_bench/commands",
  "src/torchgeo_bench/config_schema.py",
  "src/torchgeo_bench/image_cli.py",
  "src/torchgeo_bench/legacy_run.py",
  "src/torchgeo_bench/models/build.py",
  "src/torchgeo_bench/preprocessing.py",
  "tests/test_config_schema.py",
  "tests/test_image_cli.py",
  "tests/test_lazy_commands.py",
  "tests/test_legacy_run.py",
  "tests/test_model_build.py",
  "tests/test_preprocessing.py",
]
lint.select = [
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "B008", # do not perform function calls in argument defaults
  "B905", # zip() without an explicit strict= parameter
  "D104", # missing docstring in public package
  "D105", # missing docstring in magic method
  "D107", # missing docstring in __init__ (documented in class docstring)
  "E501", # line too long (handled by ruff format)
]
lint.per-file-ignores."experiments/scripts/**/*.py" = [ "D" ]
lint.per-file-ignores."tests/**/*.py" = [ "ARG", "D" ]
lint.pydocstyle.convention = "google"

[tool.pytest]
ini_options.addopts = [
  "--verbose",
  "-m not slow and not accuracy_check",
]
ini_options.markers = [
  "slow: integration tests that load real data and run models (use -m slow to include)",
  "accuracy_check: per-class model accuracy regression tests (use -m accuracy_check to run)",
]
