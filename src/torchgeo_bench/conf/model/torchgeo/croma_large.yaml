_target_: torchgeo_bench.models.TorchGeoCromaBench
factory: croma_large
weights_class: CROMALarge_Weights
weights_member: CROMA_VIT
auto_resize: true
target_size: 120
name: tgeo_croma_large
eval:
  c_range: [-6, 5, 60]
  segmentation:
    # Hook feed-forward outputs (.1) from four depths, deepest first; each has a 15x15 grid with no CLS token.
    # Selected by hand because the introspection pattern missed the trailing index in transformer.layers.N.{0,1}.
    layers:
      - "s2_encoder.transformer.layers.23.1"
      - "s2_encoder.transformer.layers.17.1"
      - "s2_encoder.transformer.layers.11.1"
      - "s2_encoder.transformer.layers.5.1"
