# 13-channel input conv; only sweep with dataset.bands=all (RGB checkpoint is a separate config).
_target_: torchgeo_bench.models.TorchGeoResNetBench
factory: resnet50
weights_class: ResNet50_Weights
weights_member: SENTINEL2_ALL_MOCO
auto_resize: false
target_size: 224
name: tgeo_resnet50_s2all_moco
eval:
  segmentation:
    # ResNet-50: 4 stages, measured 56x56 -> 7x7. Coarse-to-fine.
    layers: ["layer4", "layer3", "layer2", "layer1"]
