# torchgeo ResNet-50 — fMoW RGB GASSL
# Feature dimension: 2048

_target_: torchgeo_bench.models.TorchGeoResNetBench
factory: resnet50
weights_class: ResNet50_Weights
weights_member: FMOW_RGB_GASSL
