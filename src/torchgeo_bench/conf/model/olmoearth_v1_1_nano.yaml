# OlmoEarth-v1.1-Nano (AI2 geospatial foundation model)
# Feature dimension: 128
# v1.1 improves accuracy with ~1.7M params (up from 1.4M in v1).

_target_: torchgeo_bench.models.OlmoEarthBenchModel
model_size: nano
version: v1_1
patch_size: 8
input_res: null
time_steps: 1
std_multiplier: 2.0
normalize: false
image_size: null  # OlmoEarth is resolution-flexible; evaluate at native size
min_image_size: 64
name: olmoearth_v1_1_nano
eval:
  segmentation:
    # Isotropic transformer (4 blocks total, 28x28 grid): no spatial pyramid,
    # so tap every block, deepest first.
    layers:
      - "encoder_model.encoder.blocks.3"
      - "encoder_model.encoder.blocks.2"
      - "encoder_model.encoder.blocks.1"
      - "encoder_model.encoder.blocks.0"
