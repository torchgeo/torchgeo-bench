# Routes S2/SAR/Landsat/NAIP by sensor; input_res defaults to 10 m for S2/SAR and 30 m for Landsat.
# The wrapper ignores dataset.normalization and uses pretrained statistics for S2/SAR, dataset statistics for Landsat.

_target_: torchgeo_bench.models.OlmoEarthBenchModel
model_size: base
patch_size: 8
input_res: null
time_steps: 1
std_multiplier: 2.0
normalize: false
image_size: null  # OlmoEarth is resolution-flexible; evaluate at native size
min_image_size: 64  # upsample 32-px datasets (e.g. m-so2sat) for denser patch grids
name: olmoearth_v1_base
