# TerraFM ViT-Base, Sentinel-2 L2A 12-band stem. Supply a local checkpoint path.
_target_: torchgeo_bench.models.TerraFMBench
variant: base
modality: s2
is_l2a: true  # GeoBench S2 is L2A; upstream forward() can only reach the L1C stem
pretrained: true
checkpoint_path: null
checkpoint_md5: null
target_size: 224
pool: cls
name: terrafm_base_s2
eval:
  segmentation:
    layers: ["blocks.11", "blocks.8", "blocks.5", "blocks.2"]
