# v1.2 uses rotary position embeddings (RoPE).

_target_: torchgeo_bench.models.OlmoEarthBenchModel
model_size: nano
version: v1_2
patch_size: 8
input_res: null
time_steps: 1
std_multiplier: 2.0
normalize: false
image_size: null  # OlmoEarth is resolution-flexible; evaluate at native size
min_image_size: 64
name: olmoearth_v1_2_nano
eval:
  segmentation:
    # All four encoder blocks share one spatial grid; use each block, deepest first (verified with experiments/scripts/introspect_seg_layers.py).
    layers: ["encoder_model.encoder.blocks.3", "encoder_model.encoder.blocks.2", "encoder_model.encoder.blocks.1", "encoder_model.encoder.blocks.0"]
