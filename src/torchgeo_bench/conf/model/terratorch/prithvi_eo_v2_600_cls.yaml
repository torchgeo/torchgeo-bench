_target_: torchgeo_bench.models.TerraTorchPrithviBench
backbone_name: prithvi_eo_v2_600
pretrained: true
target_size: 224
name: tt_prithvi_eo_v2_600_cls
eval:
  segmentation:
    # Isotropic transformer: no spatial pyramid, so tap 4 blocks
    # spread across depth, deepest first.  Derived by measurement
    # (experiments/scripts/introspect_seg_layers.py).
    layers: ["blocks.31", "blocks.23", "blocks.15", "blocks.7"]
  c_range: [-6, 5, 60]
pool: cls
