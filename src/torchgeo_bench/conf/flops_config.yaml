# Per-sample compute cost (GFLOPs) split into backbone / head / probe.
# The model group is selected by the CLI (model=<name> / --model, required).
# Synthetic inputs avoid dataset downloads. Use cloudsen12's 12 Sentinel-2 bands, not so2sat's mix of 10 S2 and 2 SAR bands.

device: cuda
resume: true

# conf/model/rcf.yaml uses `seed: ${seed}` to define its random features; match config.yaml so compute and accuracy runs measure the same model.
seed: 0

output: results/compute_cost.csv

band_configs: [rgb, s2]      # rgb = 3ch, s2 = 12ch, both sourced from cloudsen12
band_source: cloudsen12
normalization: bandspec_zscore
image_size: 224

# Keep class count fixed: FPNHead uses hidden_dim=256 throughout, and only its final 1x1 convolution depends on num_classes. That layer's FLOPs are:
#   delta = 2 * hidden_dim * n_taps * num_classes * H_f * W_f
# Most head cost comes from the backbone's feature-map resolution.
seg_head_types: [fpn, dpt]
seg_num_classes: 4
# Include RGB to compare with RGB segmentation accuracy; S2 measures the extra head cost of multispectral inputs.
seg_band_configs: [rgb, s2]

# Each model's eval.segmentation overrides this block, just as in the benchmark.
# Nothing is trained; lr, scheduler, and criterion only satisfy the shared probe/solver builder.
eval:
  segmentation:
    layers: []
    head_type: fpn
    lr: 1.0e-3
    lr_scheduler: cosine
    criterion:
      _target_: torch.nn.CrossEntropyLoss
      ignore_index: 255

# "mlp" adds a Linear(D, D, bias=False) projection, so its cost grows with the square of the embedding width.
probe_head: linear           # linear | mlp
probe_num_classes: 10

# Match the benchmark batch size for comparable throughput, latency, and peak memory. GFLOPs remains per-sample (the counter slices sample[:1]).
timing_batch_size: 64
n_warmup: 3
n_measure: 20
