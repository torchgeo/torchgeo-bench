# The CLI selects conf/model/<name>.yaml with model=<name> / --model and merges it under `model`.

seed: 0
device: cuda:0
output: null   # null uses per-model CSVs below; a path sends all image-mode row types to one CSV
results_dir: results/models
# Keep profile and intrinsic-dimension measurements separate from routine metrics. Ignored when output is set.
profile_results_dir: results/profiles
intrinsic_dim_results_dir: results/intrinsic_dim
verbose: false
resume: false  # skip completed dataset/method/config matches
mode: image    # image benchmarks | coordinate-only benchmarks

# (lon, lat) -> label benchmarks from taylor-geospatial/coordbench, using frozen coordinate encoders when mode=coord.
coord:
  output: results/coordbench_results.csv
  names: all               # all | comma-separated families (pdfm,satclip,...) or benchmark names
  methods: [knn, linear]   # subset of {knn, linear}; knn is classification-only
  split: random            # random | spatial | both (block-CV holdout)
  folds: 5
  cell_deg: 10.0           # spatial-block grid-cell size in degrees
  knn_k: 5
  knn_device: cpu          # avoids GPU FAISS; the encoder and linear probe still use `device`

# Example override: dataset.names=[m-forestnet,m-eurosat]
dataset:
  names: all
  partition: default
  batch_size: 64
  num_workers: 4              # set 0 to disable dataloader multiprocessing
  normalization: bandspec_zscore   # bandspec_zscore | model_native | minmax | minmax_zscore | identity
  bands: rgb                  # rgb | all | list of band names (e.g., [red, green, blue, nir])
  image_size: 224           # null disables dataset resizing
  time_steps: null          # PASTIS dates per sample; null keeps the upstream single-date default
  interpolation: bilinear     # area | bilinear | bicubic | nearest; used if image_size set

eval:
  bootstrap: 200
  c_range: [-6, 4, 40]      # log10 [start, stop, num_points]; per-model overrides allowed
  merge_val: true          # refit logistic regression on train+val after selecting C
  skip_linear: false
  knn_k: 5
  knn_device: null         # null = inherit device, falling back to CPU if FAISS lacks GPU support

  # Compare predicted confidence with observed accuracy (ECE / RMS-CE / MCE).
  # KNN probabilities have knn_k + 1 levels, which sets its default bin count; linear probing uses 15 bins.
  # Temperature scaling (Guo et al., 2017) adjusts linear-probe confidence using held-out validation scores; KNN uses vote fractions.
  calibration:
    n_bins_knn: null       # null = knn_k + 1
    n_bins_linear: 15
    temp_scale: false      # requires merge_val=false so validation remains held out

  # Estimate how many independent directions are present in the feature vectors.
  # Writes id_<estimator>_<split> and feature-spectrum metrics under method="intrinsic_dim".
  intrinsic_dim:
    enabled: false
    estimators: [TwoNN, MLE, lPCA]   # subset of torchid global estimators
    splits: [train]                  # any of: train, val, test
    max_samples: 10000               # null disables subsampling
    device: null                     # null = auto (cuda if available, else cpu)

  # Adds method="profile" rows for throughput, peak GPU memory, latency, parameter count, and GFLOPs (torch.utils.flop_counter).
  profile:
    enabled: false
    n_warmup: 3                      # forward passes discarded before timing
    n_measure: 20                    # timed forward passes

    # Optional CPU throughput/latency pass. Check the budget between batches; leave metrics empty if warmup exhausts it.
    cpu_throughput:
      enabled: false
      batch_size: 8                  # smaller batches keep CPU measurements manageable
      n_warmup: 1
      n_measure: 5
      time_budget_s: 300.0           # checked after each forward pass, so a slow batch can overrun it

  segmentation:
    head_type: "fpn"
    # For (B, T, C, H, W) inputs, encode each date and pool features over T before decoding.
    temporal_pool: "mean"   # mean | max
    layers: []                 # must be overridden per model for segmentation datasets
    lr: 1e-3
    epochs: 10
    batch_size: 64
    criterion:
      _target_: torch.nn.CrossEntropyLoss
      ignore_index: 255
    lr_scheduler: "cosine"  # "cosine" (CosineAnnealingLR) or "none"
    cache_features: true        # reuse frozen model features instead of rerunning the model while training the head
    cache_dtype: "float16"      # storage dtype: "float16" (half RAM) or "float32"
