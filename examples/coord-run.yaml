# Run from the repository root so the examples package is importable.
schema_version: 1
model:
  name: fourier
  target: examples.coordbench_location_encoder.FourierLocationEncoder
  kwargs:
    num_frequencies: 8
datasets: [california_housing]
evaluation:
  methods: [linear]
  split: random
  folds: 2
  cell_deg: 10.0
  knn_k: 5
  knn_device: cpu
runtime:
  device: cpu
  seed: 0
output:
  file: results/fourier_coordbench.csv
  resume: false
