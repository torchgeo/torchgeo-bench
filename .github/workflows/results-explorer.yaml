name: Results explorer

# The explorer page is a build artifact of results/**.csv that happens to be
# committed.  Left to humans it drifts: the page on main quoted May's numbers
# for three months of merged results.  This keeps it in lockstep.

on:
  push:
    branches: [main]
    paths:
      - "results/models/**"
      - "results/profiles/**"
      - "results/intrinsic_dim/**"
      - "experiments/scripts/regen_results_explorer.py"
  pull_request:
    branches: [main]
    paths:
      - "results/models/**"
      - "results/profiles/**"
      - "results/intrinsic_dim/**"
      - "experiments/scripts/regen_results_explorer.py"
  workflow_dispatch:

# Serialise: two runs regenerating and pushing the same file would conflict.
# Don't cancel in-progress pushes -- a half-applied refresh is worse than a slow one.
concurrency:
  group: results-explorer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regenerate:
    name: Regenerate results explorer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Commit back to the branch this push landed on, not a detached HEAD.
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # regen_results_explorer.py is stdlib-only, so skip the uv sync entirely.
      - name: Regenerate
        run: python experiments/scripts/regen_results_explorer.py

      - name: Show what changed
        run: git --no-pager diff --stat

      # On a PR, don't demand the contributor commit a 38 MB artifact -- just
      # prove the regeneration still works against their CSVs and let the
      # reviewer preview the page.  main is where the committed copy is fixed.
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: results-explorer
          path: docs/_static/results-explorer.html
          retention-days: 14

      - name: Commit refreshed explorer
        if: github.event_name != 'pull_request'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git add docs/_static/results-explorer.html docs/_static/_results_snapshots
          if git diff --cached --quiet; then
            echo "Explorer already in sync with results/ -- nothing to commit."
            exit 0
          fi
          git commit -m "chore(docs): refresh results explorer from results/*.csv"
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so this
          # cannot re-trigger the job.  The paths filter excludes docs/ anyway.
          git push origin HEAD:${{ github.ref_name }}
