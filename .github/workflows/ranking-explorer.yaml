name: Ranking explorer

on:
  push:
    branches: [main]
    paths:
      - "results/models/**/*.csv"
      - "results/compute_cost.csv"
  workflow_dispatch:

concurrency:
  group: ranking-explorer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate ranking explorer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Regenerate
        run: uv run --frozen python scripts/regen_leaderboard.py

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ranking-explorer
          base: main
          add-paths: |
            docs/_static/ranking_explorer.html
          commit-message: "chore(docs): refresh ranking explorer"
          title: "chore(docs): refresh ranking explorer"
          body: |
            Regenerates `docs/_static/ranking_explorer.html` from merged CSV updates.

            - Source inputs: `results/models/**/*.csv` and `results/compute_cost.csv`
            - Generator: `scripts/regen_leaderboard.py`
            - Output: `docs/_static/ranking_explorer.html`
            - Behavior: pushes to `main` that change those CSV files trigger this refresh PR; `workflow_dispatch` is available for manual runs.
          labels: automation
          delete-branch: true
