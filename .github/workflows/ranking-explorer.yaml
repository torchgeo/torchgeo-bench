name: Ranking explorer

on:
  push:
    branches: [main]
    paths:
      - "results/models/**/*.csv"
      - "results/compute_cost.csv"
  workflow_dispatch:

concurrency:
  group: ranking-explorer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate ranking explorer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Regenerate
        run: uv run --frozen python scripts/regen_leaderboard.py

      - name: Show what changed
        run: git --no-pager diff --stat

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ranking-explorer
          base: main
          add-paths: docs/_static/ranking_explorer.html
          commit-message: "chore(docs): refresh ranking explorer"
          title: "chore(docs): refresh ranking explorer"
          body: |
            Regenerated `docs/_static/ranking_explorer.html` from benchmark result CSVs on `main`
            via `scripts/regen_leaderboard.py`.

            Opened automatically because ranking input CSVs changed.

            Triggered by ${{ github.sha }}.
          labels: automation
          delete-branch: true
