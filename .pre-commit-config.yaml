repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        exclude: ^(scripts/check_refactor_style\.py|src/torchgeo_bench/config_schema\.py|src/torchgeo_bench/image_cli\.py|src/torchgeo_bench/legacy_run\.py|src/torchgeo_bench/preprocessing\.py|src/torchgeo_bench/models/build\.py|src/torchgeo_bench/commands|tests/test_config_schema\.py|tests/test_image_cli\.py|tests/test_legacy_run\.py|tests/test_preprocessing\.py|tests/test_model_build\.py|tests/test_lazy_commands\.py)
        args: ["--fix", "--show-fixes"]
      - id: ruff-format
        exclude: ^(scripts/check_refactor_style\.py|src/torchgeo_bench/config_schema\.py|src/torchgeo_bench/image_cli\.py|src/torchgeo_bench/legacy_run\.py|src/torchgeo_bench/preprocessing\.py|src/torchgeo_bench/models/build\.py|src/torchgeo_bench/commands|tests/test_config_schema\.py|tests/test_image_cli\.py|tests/test_legacy_run\.py|tests/test_preprocessing\.py|tests/test_model_build\.py|tests/test_lazy_commands\.py)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: sort-simple-yaml
      - id: pretty-format-json
        exclude: ^(slides-js/|docs/_static/_results_snapshots/|docs/_static/_dataset_geography/)
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: requirements-txt-fixer

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.21.0
    hooks:
      - id: pyproject-fmt

  - repo: local
    hooks:
      - id: refactor-style
        name: Check rewritten Python style and types
        entry: uv run --extra dev python scripts/check_refactor_style.py
        language: system
        pass_filenames: false
        always_run: true
      - id: uv-lock
        name: Lock dependencies with uv
        entry: uv lock
        language: system
        pass_filenames: false
